<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>마이페이지 - 호선별 인증 현황</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Pretendard", -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f7f9;
        color: #111;
      }
      header {
        background-color: #ffffff;
        padding: 12px 16px;
        font-size: 1.15rem;
        font-weight: 700;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #374151;
        text-decoration: none;
      }
      .back-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .container {
        padding: 20px 16px 40px 16px;
        max-width: 600px;
        margin: 0 auto;
      }
      .card {
        background-color: #ffffff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        border: 1px solid #e5e7eb;
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: #1f2937;
        margin: 0 0 14px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .total-summary-box {
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        color: #ffffff;
        border-radius: 14px;
        padding: 18px 16px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .total-summary-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .total-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #94a3b8;
      }
      .total-value {
        font-size: 1.4rem;
        font-weight: 800;
        color: #38bdf8;
      }
      .total-progress-bg {
        width: 100%;
        height: 10px;
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 5px;
        overflow: hidden;
      }
      .total-progress-fill {
        height: 100%;
        width: 0%;
        background-color: #38bdf8;
        border-radius: 5px;
        transition: width 0.4s ease;
      }
      .line-summary-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .line-summary-card {
        background-color: #f8fafc;
        border: 1px solid #f1f5f9;
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .subway-badge {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 0.95rem;
        flex-shrink: 0;
      }
      .line-info-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .line-info-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .line-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: #1e293b;
      }
      .line-count-percent {
        font-size: 0.85rem;
        font-weight: 700;
        color: #475569;
      }
      .line-progress-bg {
        width: 100%;
        height: 6px;
        background-color: #e2e8f0;
        border-radius: 3px;
        overflow: hidden;
      }
      .line-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        transition: width 0.4s ease;
      }
      textarea.backup-area {
        width: 100%;
        height: 90px;
        padding: 10px;
        font-size: 0.8rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        resize: none;
        margin-bottom: 12px;
        font-family: monospace;
        background-color: #f9fafb;
      }
      button.btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-primary {
        background-color: #2563eb;
        color: white;
      }
      .btn-secondary {
        background-color: #f1f5f9;
        color: #1e293b;
        border: 1px solid #cbd5e1;
      }
      .btn-success {
        background-color: #10b981;
        color: white;
      }
      .btn-danger {
        background-color: #ef4444;
        color: white;
      }
      .info-text {
        font-size: 0.85rem;
        color: #6b7280;
        margin-bottom: 16px;
        line-height: 1.4;
      }
      .modal-overlay {
        display: none;
        position: fixed;
        z-index: 10;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .modal-overlay.show {
        display: flex;
        opacity: 1;
      }
      .modal-content {
        background-color: white;
        width: 100%;
        max-width: 480px;
        border-radius: 16px;
        padding: 24px 20px;
        position: relative;
      }
      .close-btn {
        position: absolute;
        top: 16px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
        color: #aaa;
      }
      .tab-menu {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 8px;
        overflow-x: auto;
      }
      .tab-link {
        flex: 0 0 auto;
        padding: 8px 12px;
        background: none;
        border: none;
        font-size: 0.9rem;
        font-weight: 700;
        color: #6b7280;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tab-link.active {
        color: #2563eb;
        border-bottom-color: #2563eb;
      }
      .tab-content,
      .region-tab-content {
        display: none;
      }
      .tab-content.active,
      .region-tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="index.html" class="back-btn" aria-label="메인 페이지로 이동">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
          </svg>
        </a>
        <span>👤 마이페이지</span>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <div class="card-title"><span>📊 종합 인증 현황</span></div>
        <div class="total-summary-box">
          <div class="total-summary-header">
            <span class="total-title">전체 수도권 지하철 달성률</span>
            <span class="total-value" id="totalPercentText">0%</span>
          </div>
          <div class="total-progress-bg">
            <div class="total-progress-fill" id="totalProgressFill"></div>
          </div>
          <div style="font-size: 0.8rem; color: #cbd5e1; text-align: right">
            총 인증
            <span id="totalVerifiedCount" style="color: #fff; font-weight: 700"
              >0</span
            >
            / <span id="totalStationCount">0</span>개 역
          </div>
        </div>
        <button class="btn btn-secondary" onclick="openLineModal()">
          🔍 호선별 달성률 상세 보기
        </button>
      </div>

      <div class="card">
        <h3 class="card-title">💾 데이터 관리</h3>
        <p class="info-text">
          기기 변경이나 백업이 필요할 때 인증 기록을 추출하거나 이전 기록을
          복원할 수 있습니다.
        </p>
        <button class="btn btn-primary" onclick="openBackupModal()">
          📦 백업 및 복원하기
        </button>
      </div>

      <div class="card" style="border-color: #fecaca">
        <h3 class="card-title" style="color: #dc2626">⚠️ 데이터 초기화</h3>
        <p class="info-text">
          이 기기에 저장된 모든 방문 인증 기록을 삭제합니다.
        </p>
        <button class="btn btn-danger" onclick="resetData()">
          🗑️ 모든 데이터 초기화
        </button>
      </div>
    </div>

    <!-- 호선별 달성률 모달 -->
    <div id="lineModal" class="modal-overlay">
      <div
        class="modal-content"
        style="max-height: 85vh; display: flex; flex-direction: column"
      >
        <span class="close-btn" onclick="closeLineModal()">&times;</span>
        <h3 style="margin-top: 0; margin-bottom: 16px; color: #111">
          📊 호선별 인증 현황
        </h3>
        <div class="tab-menu" id="regionTabMenu">
          <button class="tab-link active" onclick="switchRegionTab('capital')">
            수도권
          </button>
          <button class="tab-link" onclick="switchRegionTab('busan')">
            부산
          </button>
        </div>
        <div style="overflow-y: auto; flex: 1; padding-right: 2px">
          <div id="region-capital" class="region-tab-content active">
            <div class="line-summary-grid" id="lineSummaryGrid"></div>
          </div>
          <div id="region-busan" class="region-tab-content">
            <p class="info-text" style="text-align: center; padding: 40px 0">
              부산 도시철도 데이터 준비 중입니다.
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- 백업 & 복원 모달 -->
    <div id="backupModal" class="modal-overlay">
      <div class="modal-content">
        <span class="close-btn" onclick="closeBackupModal()">&times;</span>
        <h3 style="margin-top: 0; margin-bottom: 16px; color: #111">
          📦 백업 및 복원
        </h3>
        <div class="tab-menu">
          <button class="tab-link active" onclick="switchTab('exportTab')">
            📤 내보내기(백업)
          </button>
          <button class="tab-link" onclick="switchTab('importTab')">
            📥 불러오기(복원)
          </button>
        </div>
        <div id="exportTab" class="tab-content active">
          <p class="info-text">아래 생성된 백업 코드를 복사하여 보관하세요.</p>
          <textarea id="exportText" class="backup-area" readonly></textarea>
          <button class="btn btn-primary" onclick="copyBackupCode()">
            📋 백업 코드 복사하기
          </button>
        </div>
        <div id="importTab" class="tab-content">
          <p class="info-text">
            이전에 보관해 둔 백업 코드를 아래에 붙여넣고 적용 버튼을 누르세요.
          </p>
          <textarea
            id="importText"
            class="backup-area"
            placeholder="백업 코드를 여기에 붙여넣으세요..."
          ></textarea>
          <button class="btn btn-success" onclick="applyBackupCode()">
            📥 기록 불러오기 적용
          </button>
        </div>
      </div>
    </div>

    <!-- 외부 스크립트 연결 -->
    <script src="stations.js"></script>
    <script src="stations-db.js"></script>
    <script>
      const LINE_STYLES = {
        "1호선": { bg: "#0052A4", text: "1" },
        "2호선": { bg: "#33A23D", text: "2" },
        "3호선": { bg: "#EF7C1C", text: "3" },
        "4호선": { bg: "#00A4E9", text: "4" },
        "5호선": { bg: "#996CAD", text: "5" },
        "6호선": { bg: "#CD7C2F", text: "6" },
        "7호선": { bg: "#747F00", text: "7" },
        "8호선": { bg: "#EA545D", text: "8" },
        "9호선": { bg: "#BDB092", text: "9" },
        경의중앙선: { bg: "#77C4A3", text: "경의" },
        수인분당선: { bg: "#EA9811", text: "수인" },
        신분당선: { bg: "#D4003B", text: "신" },
      };

      // 노선 명칭 정규화 함수 (1호선, 2호선, 3호선 등 모든 호선 및 지선을 표준 노선명으로 정규화)
      function parseSingleLineName(raw) {
        if (!raw) return "";
        let name = raw.trim().replace(/^서울\s*|지하철\s*/g, "");

        if (
          name.includes("1호선") ||
          name.includes("경인선") ||
          name.includes("경부선") ||
          name.includes("병점지선")
        ) {
          return "1호선";
        }

        if (
          name.includes("2호선") ||
          name.includes("성수지선") ||
          name.includes("신정지선")
        ) {
          return "2호선";
        }

        if (name.includes("3호선") || name.includes("일산선")) {
          return "3호선";
        }

        if (/^\d+$/.test(name)) name += "호선";
        return name;
      }

      // 개별 노선 페이지(line1.html, line2.html, line3.html 등)의 storageKey 규칙인 lineN_verified_stations 매핑
      function getStorageKeyByLineName(lineName) {
        const num = lineName.replace(/[^0-9]/g, "");
        return num
          ? `line${num}_verified_stations`
          : `line_${lineName.replace(/\s+/g, "_")}_verified_stations`;
      }

      function ensureStationMaster() {
        if (typeof stationMaster === "undefined" || !stationMaster) {
          window.stationMaster = {};
        }

        if (window.DEFAULT_STATION_DB) {
          Object.keys(window.DEFAULT_STATION_DB).forEach((rawLineName) => {
            const lineName = parseSingleLineName(rawLineName);
            const stationList = window.DEFAULT_STATION_DB[rawLineName];
            stationList.forEach((stName, idx) => {
              const customId = `db_${lineName}_${stName}_${idx + 1}`;
              const exists = Object.values(stationMaster).some(
                (s) =>
                  s.name === stName && getLinesFromStation(s).includes(lineName)
              );

              if (!exists) {
                stationMaster[customId] = {
                  id: customId,
                  name: stName,
                  line: lineName,
                };
              }
            });
          });
        }
      }

      function getLinesFromStation(station) {
        if (!station) return [];
        let lines = [];
        if (station.line) {
          station.line.split("/").forEach((rl) => {
            const norm = parseSingleLineName(rl);
            if (norm && !lines.includes(norm)) lines.push(norm);
          });
        }
        return lines;
      }

      function getLineStyle(lineName) {
        return (
          LINE_STYLES[lineName] || { bg: "#475569", text: lineName.slice(0, 2) }
        );
      }

      async function initMyPage() {
        if (typeof loadStationsFromGoogleSheet === "function") {
          try {
            await loadStationsFromGoogleSheet();
          } catch (e) {}
        }
        ensureStationMaster();
        renderProgressSummary();
      }

      window.addEventListener("DOMContentLoaded", initMyPage);

      function renderProgressSummary() {
        ensureStationMaster();
        const gridContainer = document.getElementById("lineSummaryGrid");
        gridContainer.innerHTML = "";

        const lineGroups = {};
        const allUniqueNames = new Set();

        Object.keys(stationMaster).forEach((id) => {
          const station = stationMaster[id];
          if (!station || !station.name) return;

          const stName = station.name.trim();
          allUniqueNames.add(stName);

          getLinesFromStation(station).forEach((normLine) => {
            if (!lineGroups[normLine]) lineGroups[normLine] = new Map();
            if (!lineGroups[normLine].has(stName)) {
              lineGroups[normLine].set(stName, []);
            }
            lineGroups[normLine].get(stName).push(id);
          });
        });

        const sortedLines = Object.keys(lineGroups).sort((a, b) => {
          const numA = parseInt(a.replace(/[^0-9]/g, ""));
          const numB = parseInt(b.replace(/[^0-9]/g, ""));
          if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
          return a.localeCompare(b, "ko");
        });

        let totalVerifiedAll = 0;
        const combinedBackupData = {};

        allUniqueNames.forEach((stName) => {
          const relatedStations = Object.values(stationMaster).filter(
            (s) => s && s.name && s.name.trim() === stName
          );

          let isVerified = false;
          relatedStations.forEach((station) => {
            getLinesFromStation(station).forEach((normLine) => {
              const storageKey = getStorageKeyByLineName(normLine);
              const savedData = JSON.parse(
                localStorage.getItem(storageKey) || "{}"
              );
              if (savedData[station.id] || savedData[stName]) {
                isVerified = true;
                combinedBackupData[station.id] = true;
              }
            });
          });

          if (isVerified) totalVerifiedAll++;
        });

        sortedLines.forEach((lineName) => {
          const stationMap = lineGroups[lineName];
          const totalLineStations = stationMap.size;
          if (totalLineStations === 0) return;

          const storageKey = getStorageKeyByLineName(lineName);
          const savedData = JSON.parse(
            localStorage.getItem(storageKey) || "{}"
          );

          let lineVerifiedCount = 0;
          stationMap.forEach((ids, stName) => {
            const isVerified =
              savedData[stName] || ids.some((id) => savedData[id]);
            if (isVerified) {
              lineVerifiedCount++;
            }
          });

          const linePercent = Math.round(
            (lineVerifiedCount / totalLineStations) * 100
          );
          const style = getLineStyle(lineName);

          const card = document.createElement("div");
          card.className = "line-summary-card";
          card.innerHTML = `
            <div class="subway-badge" style="background-color: ${style.bg};">${style.text}</div>
            <div class="line-info-box">
              <div class="line-info-top">
                <span class="line-name">${lineName}</span>
                <span class="line-count-percent">${lineVerifiedCount}/${totalLineStations}역 (${linePercent}%)</span>
              </div>
              <div class="line-progress-bg">
                <div class="line-progress-fill" style="width: ${linePercent}%; background-color: ${style.bg};"></div>
              </div>
            </div>
          `;
          gridContainer.appendChild(card);
        });

        const overallPercent =
          allUniqueNames.size > 0
            ? Math.round((totalVerifiedAll / allUniqueNames.size) * 100)
            : 0;
        document.getElementById("totalStationCount").innerText =
          allUniqueNames.size;
        document.getElementById("totalVerifiedCount").innerText =
          totalVerifiedAll;
        document.getElementById(
          "totalPercentText"
        ).innerText = `${overallPercent}%`;
        document.getElementById(
          "totalProgressFill"
        ).style.width = `${overallPercent}%`;
        document.getElementById("exportText").value =
          JSON.stringify(combinedBackupData);
      }

      function openLineModal() {
        document.getElementById("lineModal").classList.add("show");
      }
      function closeLineModal() {
        document.getElementById("lineModal").classList.remove("show");
      }
      function openBackupModal() {
        document.getElementById("backupModal").classList.add("show");
      }
      function closeBackupModal() {
        document.getElementById("backupModal").classList.remove("show");
      }
      function switchRegionTab(code) {
        document
          .querySelectorAll(".region-tab-content")
          .forEach((c) => c.classList.remove("active"));
        document
          .querySelectorAll("#regionTabMenu .tab-link")
          .forEach((l) => l.classList.remove("active"));
        document.getElementById(`region-${code}`).classList.add("active");
        event.target.classList.add("active");
      }
      function switchTab(tabId) {
        document
          .querySelectorAll("#backupModal .tab-content")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll("#backupModal .tab-link")
          .forEach((l) => l.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        event.target.classList.add("active");
      }
      function copyBackupCode() {
        const el = document.getElementById("exportText");
        el.select();
        navigator.clipboard
          .writeText(el.value)
          .then(() => alert("복사되었습니다!"));
      }
      function applyBackupCode() {
        try {
          const parsed = JSON.parse(
            document.getElementById("importText").value.trim()
          );
          Object.keys(parsed).forEach((id) => {
            if (parsed[id] && stationMaster[id]) {
              getLinesFromStation(stationMaster[id]).forEach((line) => {
                const key = getStorageKeyByLineName(line);
                const saved = JSON.parse(localStorage.getItem(key) || "{}");
                saved[id] = true;
                localStorage.setItem(key, JSON.stringify(saved));
              });
            }
          });
          renderProgressSummary();
          closeBackupModal();
          alert("복구 완료!");
        } catch (e) {
          alert("올바르지 않은 코드입니다.");
        }
      }
      function resetData() {
        if (confirm("모든 기록을 삭제하시겠습니까?")) {
          localStorage.clear();
          renderProgressSummary();
          alert("초기화 완료");
        }
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>서울 지하철 모바일 인증 - 1호선</title>
    <!-- 공통 스타일시트 연동 -->
    <link rel="stylesheet" href="transfer-badges.css" />
    <link rel="stylesheet" href="line-core.css" />
    <style>
      /* 1호선 심플 배지 스타일 */
      .header-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background-color: #0052a4;
        color: #ffffff;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.95rem;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="index.html" class="back-btn" aria-label="메인 페이지로 이동">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
          </svg>
        </a>
        <span id="headerTitle">
          <span class="header-badge">1</span>
        </span>
      </div>
      <a href="mypage.html" class="mypage-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
          />
        </svg>
      </a>
    </header>

    <div id="adminBanner" class="admin-banner">
      ⚡ 관리자 모드 활성화됨 (위치 제한 없이 인증 가능)
    </div>

    <!-- 스크립트에서 동적으로 탭 생성 -->
    <div class="line-tabs" id="tabContainer"></div>

    <!-- 스크롤이 전용으로 동작하는 역 목록 영역 -->
    <div class="station-container" id="stationList"></div>

    <button id="adminFab" class="admin-fab" onclick="toggleAdminMode()">
      ⚙️ 관리자 OFF
    </button>

    <div class="stats-bar">
      <div class="stats-info">
        <span
          ><span id="progressTitle">인증 진행도: </span
          ><span id="verifiedCount">0</span> / <span id="totalCount">0</span>개
          역</span
        >
        <span class="stats-percentage" id="percentageText">0%</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 방문 인증 모달 -->
    <div id="stationModal" class="modal-overlay">
      <div class="bottom-sheet">
        <div class="drag-handle"></div>
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle" style="margin: 0 0 10px 0; color: #111">역 이름</h3>
        <iframe id="mapFrame" class="map-frame" src=""></iframe>
        <div id="distanceResult" class="distance-result">
          버튼을 눌러 거리를 측정하세요.
        </div>
        <button id="calcBtn" class="action-btn" onclick="calcDistance()">
          📍 내 위치와 거리 측정
        </button>
        <button id="verifyBtn" class="action-btn" onclick="verifyStation()">
          ✅ 인증 완료하기
        </button>
      </div>
    </div>

    <!-- 외부 스크립트 및 설정 객체 -->
    <script src="stations.js"></script>
    <script src="transfer-badges.js"></script>
    <script>
      const LINE_CONFIG = {
        id: "line1",
        name: "1호선",
        color: "#0052A4",
        storageKey: "line1_verified_stations",
        csvUrl:
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsEzg3A43H5aeKr_s_LY4H-2l8tz-zqr8tDzkpF4JkRdKdg_tU9TM8cxraMQY8VqFHEPDiE3muUB-X/pub?gid=1392561955&single=true&output=csv",
        tabs: [
          { id: "main", name: "연천-신창" },
          { id: "gyeongin", name: "구로-인천(경인)" },
          { id: "gm", name: "금천구청-광명" },
          { id: "sd", name: "병점-서동탄" },
        ],
      };
    </script>
    <script src="line-core.js"></script>
  </body>
</html>
